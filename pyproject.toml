[project]
name = "bomberman-dqn"
version = "0.1.0"
description = "Reproducible DQN-only experiments for discrete-action Bomberman"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "omegaconf>=2.3,<3",
    "pillow>=10,<13",
    "pygame>=2.5,<3",
    "torch>=2.4,<3",
    "tqdm>=4.66,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
